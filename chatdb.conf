# ChatDB v2.0 配置文件
# 用法: ./chatdb -c chatdb.conf

# ==================== SQLite ====================
sqlite_path=chatdb.sqlite

# ==================== Redis ====================
redis_host=127.0.0.1
redis_port=6379
redis_password=
redis_db=0
redis_pool_size=4

# ==================== Ollama (默认 Provider) ====================
ollama_host=127.0.0.1
ollama_port=11434
ollama_model=nomic-embed-text
ollama_timeout_ms=300000
ollama_embedding_dim=768

# ==================== OpenAI (可选) ====================
openai_api_base=https://api.openai.com/v1
openai_api_key=
openai_model=text-embedding-3-small

# ==================== 阿里云 (可选) ====================
aliyun_api_base=https://dashscope.aliyuncs.com/api/v1
aliyun_api_key=
aliyun_model=text-embedding-v2

# ==================== 向量策略 ====================
vector_retention_days=7
use_int8_quantization=false
vector_batch_size=8

# ==================== TCP Server (前端/AstrBot) ====================
tcp_port=17320
tcp_max_clients=32

# ==================== WS Client (QQ) ====================
ws_host=127.0.0.1
ws_port=3001
ws_path=/
ws_access_token=

# ==================== 进程守护 ====================
guard_processes=python,node
guard_check_interval_ms=10000

# ==================== 性能 ====================
worker_threads=2
sqlite_batch_size=100
sqlite_flush_interval_ms=500
sqlite_wal_size_limit_mb=100

# ==================== 去重 ====================
dedup_window_seconds=300

# ==================== 端口检测 ====================
auto_detect_ports=true
interactive_fallback=true
